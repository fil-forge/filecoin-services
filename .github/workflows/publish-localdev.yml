name: Publish Localdev Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'service_contracts/localdev/**'
      - 'service_contracts/lib/**'
      - 'service_contracts/src/**'
      - 'service_contracts/script/**'
      - 'service_contracts/josuke.json'
      - 'service_contracts/Makefile'
      - 'service_contracts/foundry.toml'
      - '.github/workflows/publish-localdev.yml'
  # Pull requests build the image without pushing it, then smoke-test it.
  pull_request:
    paths:
      - 'service_contracts/localdev/**'
      - 'service_contracts/lib/**'
      - 'service_contracts/src/**'
      - 'service_contracts/script/**'
      - 'service_contracts/josuke.json'
      - 'service_contracts/Makefile'
      - 'service_contracts/foundry.toml'
      - '.github/workflows/publish-localdev.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fil-forge/filecoin-localdev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The build takes about 15 minutes. One that compiles the contracts under
    # emulation takes over 40, so stop it early.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./service_contracts
          file: ./service_contracts/localdev/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Starts the image of each platform and checks that it deploys the contracts
  # offline and without compiling them. The build reuses the layers the
  # build-and-push job cached.
  smoke-test:
    if: github.event_name == 'pull_request'
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./service_contracts
          file: ./service_contracts/localdev/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: filecoin-localdev:smoke-test
          cache-from: type=gha

      - name: Deploy the contracts in a container
        env:
          PLATFORM: ${{ matrix.platform }}
        run: service_contracts/localdev/scripts/smoke-test.sh filecoin-localdev:smoke-test "$PLATFORM"
